<VirtualHost *:80>
        ServerName tercera.com
        ServerAlias www.tercera.com web.tercera.com
        ServerAdmin webmaster@tercera.com

        DocumentRoot /var/www/tercera.com
        DirectoryIndex index.html

        ErrorLog ${APACHE_LOG_DIR}/tercera.com-error.log
        CustomLog ${APACHE_LOG_DIR}/tercera.com-access.log combined
</VirtualHost>

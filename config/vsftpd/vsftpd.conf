# vsftpd - local users only, each one jailed in their own FTP folder

listen=NO
listen_ipv6=YES

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
utf8_filesystem=YES
ftpd_banner=Welcome to the tercera.com FTP server

# Only the users listed in /etc/vsftpd.userlist may log in
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Jail every user in /home/<user>/ftp. That folder belongs to root and is
# read-only (vsftpd refuses a writable chroot); uploads go to ftp/files.
chroot_local_user=YES
user_sub_token=$USER
local_root=/home/$USER/ftp

# Passive mode on a fixed port range so the firewall can allow it
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100

# Explicit FTPS: logins and data must be encrypted
ssl_enable=YES
rsa_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
rsa_private_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=NO

secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

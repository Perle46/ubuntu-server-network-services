# ISC DHCP server - lab network 192.168.100.32/27

default-lease-time 600;
max-lease-time 7200;
authoritative;

subnet 192.168.100.32 netmask 255.255.255.224 {
  range 192.168.100.40 192.168.100.62;
  option domain-name "tercera.com";
  option domain-name-servers 192.168.100.33;
  option broadcast-address 192.168.100.63;
}

# Reservation for the Windows client. The fixed address sits outside the
# dynamic range so it can never be leased to another machine.
host windows-client {
  hardware ethernet 08:00:27:60:73:D8;
  fixed-address 192.168.100.37;
}
